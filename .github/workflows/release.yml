name: Release

on:
  push:
    tags: ['v*']
  release:
    types: [published]

concurrency: release-${{ github.ref }}

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build addon zips
        run: |
          mkdir -p dist build
          : > notes.md
          for dir in pgnet/plugin.video.pgnet plugin.video.vr; do
            id=$(basename "$dir")
            version=$(sed -n 's/.*<addon [^>]*version="\([^"]*\)".*/\1/p' "$dir/addon.xml")

            # Kodi 19+ (Python 3)
            (cd "$(dirname "$dir")" && zip -qr "$GITHUB_WORKSPACE/dist/$id-$version.zip" "$id" -x '*.pyc' '*.pyo' '*/__pycache__/*')

            # Kodi 17/18 (Python 2): same code, older xbmc.python requirement
            rm -rf "build/$id" && cp -r "$dir" "build/$id"
            sed -i 's/addon="xbmc.python" version="3.0.0"/addon="xbmc.python" version="2.25.0"/' "build/$id/addon.xml"
            (cd build && zip -qr "$GITHUB_WORKSPACE/dist/$id-$version-kodi18.zip" "$id" -x '*.pyc' '*.pyo' '*/__pycache__/*')

            printf '### %s %s\n\n```\n%s\n```\n\n' "$id" "$version" "$(cat "$dir/changelog.txt")" >> notes.md
          done
          printf '`*-kodi18.zip` is for Kodi 17/18 (Python 2), the other zips are for Kodi 19 and newer.\n' >> notes.md
          ls -l dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.zip --title "$GITHUB_REF_NAME" --notes-file notes.md
          fi
